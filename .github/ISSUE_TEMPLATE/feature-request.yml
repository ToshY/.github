# yaml-language-server: $schema=https://json.schemastore.org/github-issue-forms.json
# docs: https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/syntax-for-issue-forms

name: 🚀 Feature Request
description: New features and improvements
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this feature request!
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the new feature.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example
      description: |
        A simple example of the new feature in action.
  - type: textarea
    attributes:
      label: Additional context
      description: Add any other context about the feature request
      placeholder: You can attach images or log files by clicking this area to highlight it and then dragging files in
